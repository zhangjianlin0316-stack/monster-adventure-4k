    hp: Math.floor(b[0] * 2 * L / 100) + L + 10,
    atk: Math.floor(b[1] * 2 * L / 100) + 5,

    spd: Math.floor(b[3] * 2 * L / 100) + 5

}

}
function P(c, pts, fill, noStroke) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);

  c.closePath(); c.fillStyle = fill; c.fill(); if (!noStroke) c.stroke();
}
function eye(c, x, y, r) {
  E(c, x, y, r, r * 1.25, '#1d1d28', 0, true);

}
function star(c, cx, cy, n, r1, r2, fill, rot) {

}
